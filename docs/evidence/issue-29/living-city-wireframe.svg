<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Brindle Bay living-city desktop target wireframe</title>
  <desc id="description">A dominant tilted waterfront city map with roads, sidewalks, crossings, buildings, public spaces, many recognizable walkers, a selected person, time controls, and a compact observer panel.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12243a" />
      <stop offset="1" stop-color="#243a4c" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6680" />
      <stop offset="1" stop-color="#163e5a" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07111d" flood-opacity="0.42" />
    </filter>
    <g id="person">
